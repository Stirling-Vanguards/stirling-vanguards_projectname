<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog Finder (working title)</title>

  <!-- MapLibre GL JS. Version is pinned; VERIFY it exists on unpkg before relying on it.
       For the demo, vendor these two files into app/public/ so nothing depends on a CDN. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="src/map/map.css">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/components.css">
  <link rel="stylesheet" href="src/styles/layout.css">
</head>
<body>
  <!-- Visually hidden page heading for screen readers (inline style so it works without a shared class). -->
  <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Earth analog finder</h1>

  <main id="app">
    <!-- Kurt: map and dimension toggle -->
    <section id="map-wrap" aria-label="Map of Earth analog sites">
      <div id="dimension-toggle"></div>
      <div id="map"></div>
      <div id="map-legend"></div>
      <div id="map-status" role="alert" hidden></div>
    </section>

    <aside id="side" aria-label="Selected site details">
      <div id="site-card-slot" aria-live="polite"></div>   <!-- Ely: site analog card (mounted by src/main.js) -->
      <div id="comparison-slot"></div>                      <!-- Vince: Earth-vs-target comparison -->
    </aside>
    <section id="bottom" aria-label="Ranked sites">
      <div id="site-table-slot"></div>                      <!-- Ely: ranked table and filters (mounted by src/main.js) -->
    </section>
  </main>

  <!-- ES modules need a local server. Separate modules so one failing import cannot break the other. -->
  <script type="module" src="src/map/map.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
