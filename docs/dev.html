<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app/src/styles/tokens.css">
<link rel="stylesheet" href="app/src/styles/components.css">
<main style="display:grid;gap:1.5rem;padding:1rem;max-width:60rem;margin:auto"></main>
<script type="module">
  import { renderSiteCard } from './app/src/components/siteCard.js';
  import { renderRankedTable } from './app/src/components/rankedTable.js';
  const sites = await (await fetch('data/processed/sample_sites.json')).json();
  const main = document.querySelector('main');
  const card = document.createElement('div');
  const show = (s) => card.replaceChildren(renderSiteCard(s));
  show(sites[0]);
  const table = renderRankedTable(sites, { onOpen: show, onLocate: (s) => console.log('locate', s.coordinates) });
  main.append(table.element, card);
</script>
