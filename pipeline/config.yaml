# pipeline/config.yaml
dimensions: [terrain, thermal, geology, subsurface]
stretch_dimensions: []

weights:
  terrain: 1.0
  thermal: 1.0
  geology: 1.0
  subsurface: 1.0

common_scale_km: 0.5
grid_cell_km: 0.5
drilldown_sites: 4

confidence_rules:
  high: "both sides direct measurements at comparable resolution"
  medium: "one side modelled or resampled by a large factor"
  low: "catalog-only, sparse, or proxy data"

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  targets: pipeline/targets/targets.yaml
  schema: docs/data_contract.schema.json
  app_data: app/public/data

output:
  target_bodies: [moon, mars]
  score_range: [0.0, 1.0]

scoring:
  tolerances:
    slope_median: 5.0
    slope_p90: 10.0
    slope_mean: 5.0
    pct_below_10deg: 20.0
    temp_min: 50.0
    temp_max: 50.0
    diurnal_swing: 50.0
    seasonal_variation: 50.0
  resample_factor_limit: 4
  strength_min: 0.7
  breakdown_max: 0.4
  require_verified_targets: false
  data_quality:
    earth:
      terrain: {kind: direct, resolution_m: 30}
      thermal: {kind: direct, resolution_m: 18500}
      geology: {kind: catalog, resolution_m: null}
      subsurface: {kind: catalog, resolution_m: null}
    moon:
      terrain: {kind: direct, resolution_m: 240}
      thermal: {kind: proxy, resolution_m: 240}
      geology: {kind: catalog, resolution_m: null}
      subsurface: {kind: catalog, resolution_m: null}
    mars:
      terrain: {kind: direct, resolution_m: 463}
      thermal: {kind: proxy, resolution_m: 100}
      geology: {kind: catalog, resolution_m: null}
      subsurface: {kind: catalog, resolution_m: null}
  earth_data_sources:
    terrain: ["Copernicus GLO-30 DEM (30m)"]
    thermal: ["WorldClim v2.1 (10 arcmin)"]
    geology: ["USGS / GLiM Analog Lithology Catalog"]
    subsurface: ["Analog Subsurface & Karst/Lava-Tube Catalog"]
