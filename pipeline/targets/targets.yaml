# Target site profiles
schema_version: 1

targets:
  - site_id: lunar_south_pole
    name: "Lunar South Polar Site"
    target_body: moon
    coordinates: [30.0, -88.0]
    footprint_radius_km: 5
    dimensions:
      terrain:
        features: [slope_median, slope_p90, roughness, crater_density]
        data_sources: ["LRO LOLA GDRDSM (240m)"]
        computed: true
      thermal:
        features: [temp_min, temp_max, diurnal_swing, seasonal_variation]
        data_sources: ["LRO Diviner Polar Cumulative Product Baseline (Paige et al., 2010; Williams et al., 2019)"]
        computed: false
        verified: false
      geology:
        target_classes: [anorthosite, impact_breccia, basalt, regolith]
        data_sources: ["USGS Unified Geologic Map of the Moon / Kaguya MI"]
        source_citation: "Fortezzo et al. (2020), USGS Unified Geologic Map of the Moon"
        verified: false
      subsurface:
        target_features: [ground_ice, regolith_mantle, impact_fractures, lava_tubes]
        data_sources: ["LRO Diviner / Mini-RF / Wagner & Robinson (2014) Lunar Pit Atlas"]
        source_citation: "Wagner & Robinson (2014), Icarus 237, 52-60"
        verified: false
    breakdowns:
      - "Permanently shadowed regions and cold traps have no real Earth equivalent"
      - "Vacuum, low gravity and radiation cannot be replicated on Earth"

  - site_id: jezero_crater
    name: "Jezero Crater"
    target_body: mars
    coordinates: [77.5, 18.4]
    footprint_radius_km: 5
    dimensions:
      terrain:
        features: [slope_median, slope_p90, roughness, crater_density]
        data_sources: ["MGS MOLA MEGDR (463m)"]
        computed: true
      thermal:
        features: [temp_min, temp_max, diurnal_swing, seasonal_variation]
        data_sources: ["MGS TES / Mars 2020 MEDA Baseline (Martinez et al., 2023)"]
        computed: false
        verified: false
      geology:
        target_classes: [carbonates, clays, olivine, basalt, sulfates, impact_breccia]
        data_sources: ["MRO CRISM / USGS Geologic Map of Mars (SIM 3292)"]
        source_citation: "Horgan et al. (2020), Icarus 339; Tanaka et al. (2014), USGS SIM 3292"
        verified: false
      subsurface:
        target_features: [layered_sediments, basaltic_fractures, evaporite_layers, ground_ice]
        data_sources: ["MRO SHARAD / Mars Global Cave Candidate Catalog (MGC3)"]
        source_citation: "Cushing (2015), USGS Mars Global Cave Candidate Catalog"
        verified: false
    breakdowns:
      - "Mars atmosphere is much thinner than Earth's, so wind and dust behave differently"
      - "Gravity and radiation environment cannot be replicated on Earth"
