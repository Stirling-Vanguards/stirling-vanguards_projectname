# Validation expectations: which known analogs SHOULD score high (or low) on which dimension.
settings:
  min_percentile: 0.75
  min_sites_for_rank: 8
  tolerance_scales: [0.75, 1.0, 1.25]

validation_sites:
  - site_id: atacama
    name: "Atacama Desert"
    expect_high:
      - target: jezero_crater
        dimension: thermal
    expect_low:
      - target: lunar_south_pole
        dimension: thermal
    source_citation: "Azua-Bustos et al. (2015), Astrobiology 15(1):1-14 — Atacama as a Mars analog"
    verified: true

  - site_id: haughton_crater
    name: "Haughton impact crater"
    expect_high:
      - target: jezero_crater
        dimension: geology
    expect_low: []
    source_citation: "Osinski et al. (2001), Meteoritics & Planetary Science 36(3):431-449 — Haughton as a Mars analog (geology); 5 km rim slopes exceed Jezero floor"
    verified: true

  - site_id: death_valley
    name: "Death Valley"
    expect_high:
      - target: jezero_crater
        dimension: terrain
    expect_low: []
    source_citation: "NASA Astrobiology Field Guide — Death Valley as a planetary analog site"
    verified: true

  - site_id: mcMurdo_dry_valleys
    name: "McMurdo Dry Valleys"
    expect_high:
      - target: lunar_south_pole
        dimension: thermal
      - target: lunar_south_pole
        dimension: subsurface
    expect_low: []
    source_citation: "Doran et al. (1998), Antarctic Science 10(3):259-268 — Dry Valleys as a lunar/Mars analog"
    verified: true

  - site_id: hawaii_volcanoes
    name: "Hawaiian Volcanoes (Kilauea / Mauna Loa)"
    expect_high: []
    expect_low:
      - target: lunar_south_pole
        dimension: thermal
      - target: jezero_crater
        dimension: geology
    source_citation: "NASA Planetary Field Analog inventory — Hawaii as a negative thermal control for cold traps"
    verified: true
